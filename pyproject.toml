[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp-oauth-addon"
version = "0.1.0"
description = "Independent OAuth gateway for Blender Lab MCP"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "httpx>=0.28,<0.29", "starlette>=0.46,<2", "uvicorn>=0.30,<1"]

[project.scripts]
blender-mcp-oauth = "blender_mcp_oauth.cli:main"

[tool.setuptools.packages.find]
include = ["blender_mcp_oauth*"]
